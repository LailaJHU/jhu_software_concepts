name: Module 4 Tests

# Runs the full marked pytest suite (web / buttons / analysis / db /
# integration) with coverage against a disposable PostgreSQL service
# container, and fails the build if coverage drops below 100%.
#
# NOTE: this workflow is authored but intentionally not pushed/triggered
# by the assistant that helped write it -- the student pushes it herself
# and captures the passing-run screenshot (actions_success.png) from her
# own GitHub Actions tab.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gradcafe_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/gradcafe_test
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/gradcafe_test
      FLASK_SECRET_KEY: ci-test-secret

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: module_4
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Wait for PostgreSQL
        run: |
          until pg_isready -h localhost -p 5432 -U postgres; do sleep 1; done

      - name: Run pytest with coverage
        working-directory: module_4
        run: pytest

      - name: Upload coverage HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html-report
          path: module_4/htmlcov/
