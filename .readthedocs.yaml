# Read the Docs configuration for the Module 4 Sphinx documentation.
# https://docs.readthedocs.io/en/stable/config-file/v2.html
#
# Publishing on Read the Docs requires the GitHub repository to be public;
# that's the student's own action to take (Settings -> repo visibility),
# not something done automatically by this file.

version: 2

build:
  os: ubuntu-22.04
  tools:
    python: "3.12"

sphinx:
  configuration: module_4/docs/conf.py

python:
  install:
    - requirements: module_4/docs/requirements.txt
