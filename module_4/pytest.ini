[pytest]
minversion = 7.0
testpaths = tests
pythonpath = .

markers =
    web: Flask page-rendering tests (GET / and its HTML structure)
    buttons: Pull Data / Update Analysis route and busy-state tests
    analysis: numeric formatting and analysis-aggregation tests
    db: tests that hit a real (throwaway) PostgreSQL database
    integration: end-to-end tests that combine multiple pieces together

addopts =
    -q
    --strict-markers
    --cov=src
    --cov-report=term-missing
    --cov-report=html
    --cov-fail-under=100
